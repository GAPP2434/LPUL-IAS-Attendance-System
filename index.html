<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Digital+Numbers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index-styles.css">
</head>
<body>
    <a href="admin.html" class="admin-link">Admin Page</a>

    <div class="container">
        <!-- Wrapper for title and input container -->
        <div class="input-wrapper">
            <div class="title">
                <span>Squid Game: Cyber Edition –</span><br>
                <span>Don’t Let Your Data Get</span><br>
                <span>Eliminated</span>
            </div>

            <!-- Left Box (Input Form) -->
            <div class="input-box">
                <img src="images/smile.png" alt="User Image">
                <p>Student Number:</p>
                <input type="text" placeholder="Enter your student number">
                <div class="time-buttons">
                    <button class="time-in-btn">Time In</button>
                    <button class="time-out-btn">Time Out</button>
                </div>                
            </div>
        </div>

        <!-- Right Box (Diamond Player Info) -->
        <div class="player-info">
            <div>
                <p>Player Number:</p>
                <span>000</span>
                <p>Name:</p>
                <label id="student-name">1</label>
                <p>Student Course/Year/Section: (e.g. BSIT 3-1)</p>
                <label id="student-course">1</label>
                <p>Time-in:</p>
                <label id="student-timein">1</label>
                <p>Time-out:</p>
                <label id="student-timeout">1</label>
            </div>
        </div>
    </div>
</body>
</html>
