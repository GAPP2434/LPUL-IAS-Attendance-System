<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Digital+Numbers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index-styles.css">
    <!-- API Service for organized request logic -->
    <script src="api-service.js"></script>
    <!-- Current script -->
    <script src="index-script.js" defer></script>
    <!-- Uncomment below and comment above to use improved version -->
    <!-- <script src="index-script-improved.js" defer></script> -->
</head>
<body>
    <a href="admin.html" class="admin-link">Admin Page</a>

    <div class="container">

        <div class="input-wrapper">
        <div class="input-box">
            <div class="left-logo">
                <img src="images/logo.png" alt="Logo" />
            </div>
            <h1>ATTENDANCE SYSTEM</h1>
            <div class="subtitle">HOUSEMATE CHECK-IN</div>

            <p>STUDENT NUMBER:</p>
            <input type="text" id="student-id" placeholder="Enter your student number" pattern="[0-9\-]*">

            <!-- Keep these buttons with their original IDs -->
            <button id="submit-btn">SUBMIT</button>

            <div class="time-buttons">
                <button id="clear-entry" class="hidden">Clear Entry</button>
                <button id="time-in-btn" class="hidden">Time In</button>
                <button id="time-out-btn" class="hidden">Time Out</button>
            </div>
        </div>
    </div>


    <div class="player-info">
    <!-- Background transparent image -->
    <img src="images/houseimage.png" style="width: 750px; height: auto;" alt="Student Info Background" class="info-background">

    <div>
        <p>Student Number:</p>
        <span id="player-number">0000-00000</span>

        <p>Name:</p>
        <label id="student-name">-</label>

        <p>Student Course/Year/Section:</p>
        <label id="student-course">-</label>

        <div class="time-section">
            <div class="time-in">
                <p>TIME-IN:</p>
                <label id="student-timein">-</label>
            </div>

            <div class="time-out">
                <p>TIME-OUT:</p>
                <label id="student-timeout">-</label>
            </div>
        </div>
    </div>
</div>

</body>
</html>
