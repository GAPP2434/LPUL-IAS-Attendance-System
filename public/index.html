<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Digital+Numbers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="index-styles.css">
    <script src="index-script.js" defer></script>
</head>
<body>
    <a href="admin.html" class="admin-link">Admin Page</a>

    <div class="container">
        <div class="input-wrapper">
            <div class="title">
                <span>Squid Game: Cyber Edition –</span><br>
                <span>Don’t Let Your Data Get</span><br>
                <span>Eliminated</span>
            </div>

            <div class="input-box">
                <img src="images/smile.png" alt="User Image">
                <p>Student Number:</p>
                <input type="text" id="student-id" placeholder="Enter your student number">
                <button id="submit-btn">Submit</button>

                <div class="time-buttons">
                    <button id="clear-entry" class="hidden">Clear Entry</button>
                    <button id="time-in-btn" class="hidden">Time In</button>
                    <button id="time-out-btn" class="hidden">Time Out</button>
                </div>

            </div>
        </div>

        <div class="player-info">
            <div>
                <p>Player Number:</p>
                <span id="player-number">000</span>
                <p>Name:</p>
                <label id="student-name">-</label>
                <p>Student Course/Year/Section:</p>
                <label id="student-course">-</label>
                <p>Time-in:</p>
                <label id="student-timein">-</label>
                <p>Time-out:</p>
                <label id="student-timeout">-</label>
            </div>
        </div>
    </div>
</body>
</html>
